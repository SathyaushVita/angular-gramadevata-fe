<h2 mat-dialog-title class="text-center">Confirm Logout</h2>

<mat-dialog-content class="mt-3 mb-2 text-center">
  Are you sure  want to logout?
</mat-dialog-content>

<mat-dialog-actions align="center" class="pb-2">
  <button mat-raised-button color="primary" (click)="onCancel()">No</button>
  <button mat-raised-button color="warn" class="ms-2" (click)="onConfirm()">Yes</button>
</mat-dialog-actions>
